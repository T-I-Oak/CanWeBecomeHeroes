<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achievement toast preview — v0.45.3</title>
  <link rel="stylesheet" href="../../src/styles/achievement_table.css">
  <link rel="stylesheet" href="../../src/styles/achievement_toast.css">
  <style>
    body { margin: 20px; background: #35463f; color: white; font: 16px/1.6 sans-serif; }
    button, select { margin: 4px; padding: 8px; }
    .PreviewControls { max-width: 600px; }
  </style>
</head>
<body>
  <div class="PreviewControls">
    <h1>アチーブメント通知確認 v0.45.3</h1>
    <p>通知は右下に表示されます。同じボタンを繰り返し押すと、別の行として追加されます。</p>
    <button id="first">初取得 E → C＋</button>
    <button id="next">細分段階 C− → C</button>
    <button id="batch">一括で8件追加</button>
    <button id="pause">モーダル中の待機を再現</button>
    <button id="clear">終了・再開始を再現</button>
    <label><input id="freeze" type="checkbox">演出を静止</label>
    <button id="step">100ms進める</button>
    <label>言語 <select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label>
    <p id="state">表示中</p>
  </div>
  <script type="module">
    import AchievementToast from '../../src/app/AchievementToast.js';
    const textRepository = { getLabel: () => document.documentElement.lang === 'ja' ? 'アチーブメント達成' : 'Achievement earned' };
    let toast = new AchievementToast({ textRepository });
    let blocked = false;
    const first = { id: 'pair-start:Avery|Briar', oldGrade: 0, newGrade: 6 };
    document.querySelector('#first').onclick = () => toast.enqueue([first]);
    document.querySelector('#next').onclick = () => toast.enqueue([{ ...first, oldGrade: 4, newGrade: 5 }]);
    document.querySelector('#batch').onclick = () => toast.enqueue(Array.from({ length: 8 }, () => ({ ...first })));
    document.querySelector('#pause').onclick = () => {
      blocked = !blocked;
      document.querySelector('#state').textContent = blocked ? '待機中（もう一度押すと再開）' : '表示中';
    };
    document.querySelector('#clear').onclick = () => { toast.dispose(); toast = new AchievementToast({ textRepository }); };
    document.querySelector('#language').onchange = event => { document.documentElement.lang = event.target.value; };
    document.querySelector('#step').onclick = () => toast.update(100, blocked);
    let previous = performance.now();
    function frame(time) {
      if (!document.querySelector('#freeze').checked) toast.update(time - previous, blocked);
      previous = time;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
