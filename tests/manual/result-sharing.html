<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>終了結果の共有確認</title>
  <link rel="stylesheet" href="../../src/styles.css">
  <link rel="stylesheet" href="./result-sharing.css">
</head>
<body>
  <main class="ResultSharePreview">
    <h1>終了結果の共有確認 <span id="version"></span></h1>
    <p>表示用サンプルです。プレイ記録は保存しません。</p>
    <label>言語 <select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label>
    <label>結果 <select id="outcome"><option value="certificate">合格</option><option value="failure-notice">不合格</option><option value="challenge-notice">実力判定</option></select></label>
    <label><input type="checkbox" id="long-text">長い二つ名</label>
    <button id="show-result" type="button">終了画面を開く</button>
    <button id="preview-image" type="button">共有画像を表示</button>
    <p id="preview-status" role="status"></p>
    <img id="share-preview" alt="生成した共有画像" hidden>
  </main>
  <aside id="trial-run-result" class="ModalLayer TrialRunResultModal" hidden></aside>
  <script type="module" src="./result-sharing.js"></script>
</body>
</html>
