<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フロートログ表示確認 v0.47.3</title>
  <link rel="stylesheet" href="../../src/styles.css">
  <style>
    body { background: #35463f; color: white; font-family: sans-serif; }
    .PreviewControls { position: relative; z-index: 1; padding: 12px; }
    .PreviewControls button { margin: 4px; padding: 8px; }
    .state-frozen .FlowLog__Entry.state-running { animation: none; transform: translateX(12px); }
    .state-frozen .FlowLog__Text { animation-play-state: paused; }
  </style>
</head>
<body>
  <div class="PreviewControls">
    <p>フロートログ表示確認 v0.47.3（本番のFlowLog・CSSを使用）</p>
    <button id="show">4種類を流す</button>
    <button id="freeze">配置して静止</button>
    <button id="resume">再開</button>
    <button id="clear">消去</button>
    <p>静止中に縦横・PCへリサイズすると、本文とアイコンが追従します。通常のゲーム一時停止ではログ演出は継続します。</p>
  </div>
  <aside class="FlowLog" id="flow-log"></aside>
  <script type="module">
    import FlowLog from '../../src/app/FlowLog.js';
    import GameLog from '../../src/game/GameLog.js';
    import GameTextRepository from '../../src/game/GameTextRepository.js';
    const textRepository = await new GameTextRepository().load();
    const log = new GameLog({ textRepository });
    const container = document.querySelector('#flow-log');
    const flow = new FlowLog(container, log, { random: () => 0.5 });
    function clear() {
      flow.visibleEntries.clear();
      container.replaceChildren();
      container.classList.remove('state-frozen');
    }
    function show(frozen) {
      clear();
      container.classList.toggle('state-frozen', frozen);
      ['info', 'luck', 'unluck', 'warning'].forEach((level, index) => {
        log.logLocalized({ key: 'logDamage', values: {
          actor: { kind: 'hero', heroId: 'Avery', profession: 'swordfighter' },
          target: { kind: 'enemy', id: 'small-valor' }, damage: 125,
        } }, { subject: level === 'warning' ? 'system' : 'hero', level, channel: 'battle' });
        container.lastElementChild.style.setProperty('--flow-y', `${28 + index * 16}%`);
      });
    }
    document.querySelector('#show').onclick = () => show(false);
    document.querySelector('#freeze').onclick = () => show(true);
    document.querySelector('#resume').onclick = () => container.classList.remove('state-frozen');
    document.querySelector('#clear').onclick = clear;
  </script>
</body>
</html>
