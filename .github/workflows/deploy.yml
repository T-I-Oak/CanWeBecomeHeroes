name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Checkout common library
        uses: actions/checkout@v4
        with:
          repository: T-I-Oak/GameWorksOAK
          ref: master
          path: .ci/GameWorksOAK
          persist-credentials: false

      - name: Link common library beside game
        run: ln -s "$GITHUB_WORKSPACE/.ci/GameWorksOAK" "$GITHUB_WORKSPACE/../GameWorksOAK"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
