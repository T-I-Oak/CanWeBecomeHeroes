<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>試験終了画面モックアップ</title><link rel="stylesheet" href="./phase_trial_result_mockup.css"></head>
