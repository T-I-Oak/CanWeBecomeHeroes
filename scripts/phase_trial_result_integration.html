<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>試験終了画面 本番部品の接続確認</title><link rel="stylesheet" href="../src/styles.css"></head><body>
<nav style="position:fixed;top:4px;left:8px;z-index:100;background:#fff;padding:8px;display:flex;gap:12px"><a href="?outcome=cleared">合格</a><a href="?outcome=expired">不合格</a><a href="?outcome=cleared&language=en">English</a><span>本番部品・検証用実績</span></nav>
<aside class="ModalLayer TrialRunResult" id="result" hidden></aside><p id="closed"></p>
<script type="module">
import TrialRunResultModal from '../src/app/TrialRunResultModal.js';
import GameTextRepository from '../src/game/GameTextRepository.js';
import GameStatistics from '../src/game/GameStatistics.js';
import Achievements from '../src/game/Achievements.js';
import { createTrialRunResult } from '../src/game/TrialRunResult.js';
import { setLanguage } from '../../GameWorksOAK/src/lib/core/i18n.js';
const params=new URLSearchParams(location.search);
const language=params.get('language') ?? 'ja';
document.documentElement.lang=language; setLanguage(language);
const textRepository=await new GameTextRepository().load();
const members=[{heroId:'Avery',profession:'swordfighter'},{heroId:'Briar',profession:'guard'},{heroId:'Casey',profession:'mage'},{heroId:'Darcy',profession:'cleric'}];
const statistics={runs:{trial:{'Avery|Briar':{started:1,cleared:1,expired:0}}},stages:{'boss:0':{clears:7}},combat:{enemies:{'small-valor':10,'small-iron':4,'medium-valor':2}},guildPoints:2400,facilities:{shop:7,guild:4,training:2},heroes:{Avery:{tags:{valor:4,fire:2},weapons:{sword:7},facilities:{battle:7},defeats:{'small-valor':{count:8}}},Briar:{tags:{iron:5},weapons:{shield:7},facilities:{training:2},defeats:{'small-iron':{count:4}}},Casey:{tags:{arcane:5},weapons:{staff:7},facilities:{shop:7},defeats:{'medium-valor':{count:2}}},Darcy:{tags:{blessing:4},weapons:{'holy-book':7},facilities:{guild:4},guildHours:8}}};
const state=new GameStatistics({data:statistics});
const achievements=new Achievements().evaluateRun({startGrades:{'stage-clear':12,'enemy-defeat:small-valor':12},total:state,run:state});
const record={statistics,achievements};
const result=createTrialRunResult({outcome:{state:params.get('outcome') ?? 'cleared'},members,record,language});
await new TrialRunResultModal(document.querySelector('#result'),{textRepository}).show(result);
document.querySelector('#closed').textContent='終了画面を閉じました';
</script></body></html>
