<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二つ名シミュレーター</title>
<style>
body{margin:0;background:#eee8dc;color:#30291e;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}fieldset{border:1px solid #c0b49a;border-radius:8px;background:#fffcf4;margin:16px 0;padding:16px}.controls{display:flex;gap:14px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:4px}select,input,button,textarea{font:inherit;border:1px solid #b8aa8e;border-radius:5px;padding:8px;background:white}button{cursor:pointer;background:#594733;color:white}input[type=text]{width:min(90vw,500px)}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{background:#fffcf4;border:1px solid #cdbf9f;border-radius:8px;padding:16px}.name{font-size:20px;font-weight:700;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}textarea{width:100%;min-height:420px;box-sizing:border-box;font:13px/1.5 monospace}.error{color:#a02a24}summary{cursor:pointer}.note{color:#736650}
</style>
<main>
<h1>二つ名シミュレーター</h1>
<p class="note">対象を指定して生成し、語句の出所と再帰展開を確認します。日本語の検討用・深さ制限なし。</p>
<fieldset><legend>対象と構成</legend>
<div class="controls" id="selectors"></div>
<div class="controls" style="margin-top:16px">
<label>起点<input id="template" type="text" value="[person(ally)]"></label>
<label>生成数<input id="count" type="number" min="1" max="100" value="20"></label>
<label>タグ最大保持数<input id="tagMaximum" type="number" min="1" step="1" value="1"></label>
<label>Hero名（任意）<input id="hero" type="text" value="アヴェリー"></label>
</div><p><button id="generate">生成する</button></p></fieldset>
<p id="status" role="status"></p><section id="results" class="results"></section>
<details><summary>使用候補の集合</summary><pre id="pool"></pre></details>
<details style="margin-top:16px"><summary>語句データを編集する（この画面内で反映）</summary>
<p class="note">データ変更後に「編集を反映」。保存したい場合はJSONをダウンロードできます。</p>
<textarea id="editor" aria-label="語句データJSON"></textarea>
<p><button id="apply">編集を反映</button> <button id="download">JSONをダウンロード</button></p></details>
</main>
<script type="module">
import { aggregate, generate } from './phase_epithet_simulator_engine.js';
import { getEpithetTagSkillWords } from '../src/game/EpithetTagSkill.js';
const $ = id => document.getElementById(id);
let data = await (await fetch('./phase_epithet_simulator_data.json', { cache: 'no-store' })).json();
const titles = { tag:'タグ',weapon:'武器',facility:'施設',enemy:'敵' };
function setup() {
  const previous = Object.fromEntries([...$('selectors').querySelectorAll('select')].map(select => [select.id, select.value]));
  $('selectors').replaceChildren();
  for (const [group, title] of Object.entries(titles)) {
    const label = document.createElement('label'); label.append(title);
    const select = document.createElement('select'); select.id = group;
    select.add(new Option('なし', ''));
    const options = group === 'enemy' ? data.enemies : data.targets.filter(target => target.group === group);
    for (const option of options) select.add(new Option(option.name, option.id));
    select.value = previous[group] ?? (group === 'tag' ? 'fire' : group === 'weapon' ? 'shield' : group === 'facility' ? 'facility-2' : 'small-valor');
    select.addEventListener('change', render); label.append(select); $('selectors').append(label);
  }
  $('editor').value = JSON.stringify(data, null, 2);
}
function selectedPool() {
  const definitions = [{ source:'情報共通', words:data.generic }];
  for (const group of ['tag','weapon','facility']) {
    const target = data.targets.find(item => item.group === group && item.id === $(group).value);
    if (target) {
      definitions.push({ source:`${titles[group]}：${target.name}`, words:target.words });
      if (group === 'tag') {
        const maximum = Math.max(1, Math.floor(Number($('tagMaximum').value) || 1));
        const skillWords = getEpithetTagSkillWords(target.id, maximum);
        $('tagMaximum').disabled = !skillWords;
        if (skillWords) definitions.push({ source:`${target.name}：最大${maximum}個時のタグスキル`, words:skillWords });
      }
    } else if (group === 'tag') $('tagMaximum').disabled = true;
  }
  const enemy = data.enemies.find(item => item.id === $('enemy').value);
  if (enemy) definitions.push({ source:`敵：${enemy.name}`, words:{ person_base:{ enemy:[enemy.name] }, person:{ ally:['[person_base(enemy)][actionPerson(enemy)]'] } } });
  return aggregate(definitions);
}
function render() {
  try {
    const pool = selectedPool();
    $('pool').textContent = JSON.stringify(Object.fromEntries(pool), null, 2);
    $('results').replaceChildren();
    const count = Math.max(1, Math.min(100, Number($('count').value) || 20));
    let errors = 0;
    for (let index = 0; index < count; index++) {
      const card = document.createElement('article'); card.className = 'card';
      try {
        const result = generate($('template').value, pool, data.defaults);
        const name = document.createElement('div'); name.className = 'name';
        name.textContent = result.text + ($('hero').value ? ' ' + $('hero').value : ''); card.append(name);
        const details = document.createElement('details'); const summary = document.createElement('summary');
        summary.textContent = `展開過程（${result.trace.length}回）`;
        const pre = document.createElement('pre');
        pre.textContent = result.trace.map(item => `${'  '.repeat(item.depth)}[${item.key}] → ${item.value} 【${item.source}】`).join('\n');
        details.append(summary,pre); card.append(details);
      } catch(error) { errors++; card.textContent = error.message; card.classList.add('error'); }
      $('results').append(card);
    }
    $('status').textContent = `${count}件生成${errors ? `・エラー${errors}件` : ''}。もう一度生成すると結果が変わります。`;
  } catch(error) { $('status').textContent = error.message; }
}
$('generate').addEventListener('click', render);
$('tagMaximum').addEventListener('change', render);
$('apply').addEventListener('click', () => {
  try { const parsed = JSON.parse($('editor').value); if (!Array.isArray(parsed.targets) || !Array.isArray(parsed.enemies) || !parsed.generic || !parsed.defaults) throw new Error('targets・enemies・generic・defaultsを確認してください。'); data=parsed; setup(); render(); }
  catch(error) { $('status').textContent = error.message; }
});
$('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([$('editor').value],{type:'application/json'}));
  const anchor=document.createElement('a'); anchor.href=url;anchor.download='epithet-simulation.json';anchor.click();URL.revokeObjectURL(url);
});
setup(); render();
</script>
</html>
